[package]
name = "ima-langnubi-dairy"
version = "1.0.0"
description = "Ima Langnubi Dairy - Farm & Milk Network Manager"
authors = ["Ima Langnubi Dairy"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "ima-langnubi-dairy"
path = "src/main.rs"
